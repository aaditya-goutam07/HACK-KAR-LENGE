<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Surplus-to-Shelter — Donor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Surplus-to-Shelter</h1>
    <p>Turn unsold food into someone's next meal.</p>
    <nav><a href="ngo.html">NGO / Shelter view →</a></nav>
  </header>

  <main>
    <!-- Donation Form -->
    <section id="donate-section">
      <h2>Post a Donation</h2>
      <form id="donation-form">
        <input type="text" id="food-item" placeholder="Food item (e.g. Pasta, 20 servings)" required>
        <input type="text" id="location" placeholder="Pickup location" required>
        <input type="datetime-local" id="expiry" required>
        <button type="submit">Post Donation</button>
      </form>
    </section>

    <!-- Donation List -->
    <section id="list-section">
      <h2>All Donations (live)</h2>
      <div id="donation-list"></div>
    </section>

    <!-- Impact Dashboard -->
    <section id="dashboard-section">
      <h2>Impact So Far</h2>
      <p>Meals Rescued: <span id="meals-count">0</span></p>
    </section>
  </main>

  <script type="module" src="script.js"></script>
</body>
</html>
